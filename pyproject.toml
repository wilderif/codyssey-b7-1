[project]
name = "codyssey-b7-1"
version = "0.1.0"
description = "FastAPI modular monolith chatbot"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn",
    "jinja2",
    "sqlalchemy",
    "openai",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "pyright",
    "ruff",
    "httpx2>=2.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
