{% extends "base.html" %}

{% block page_title %}회원가입 | Codyssey{% endblock %}

{% block content %}
<main id="main-content" class="page-shell">
  <section class="auth-card" aria-labelledby="signup-heading">
    <header class="auth-card__header">
      <p class="auth-card__eyebrow">Codyssey</p>
      <h1 id="signup-heading">회원가입</h1>
      <p class="auth-card__description">새 계정을 만들고 AI와 대화를 시작하세요.</p>
    </header>

    <form class="auth-form" method="post" action="/signup">
      {% if error %}
      <p id="signup-error" class="form-error" role="alert">{{ error }}</p>
      {% endif %}

      <div class="form-field">
        <label for="signup-username">아이디</label>
        <input
          id="signup-username"
          name="username"
          type="text"
          value="{{ username }}"
          required
          minlength="3"
          maxlength="30"
          autocomplete="username"
          {% if error %}aria-describedby="signup-error"{% endif %}
        >
      </div>

      <div class="form-field">
        <label for="signup-password">비밀번호</label>
        <input
          id="signup-password"
          name="password"
          type="password"
          required
          minlength="8"
          maxlength="72"
          autocomplete="new-password"
          {% if error %}aria-describedby="signup-error"{% endif %}
        >
      </div>

      <button type="submit">회원가입</button>
    </form>

    <p class="auth-card__alternative">
      이미 계정이 있나요? <a href="/login">Login</a>
    </p>
  </section>
</main>
{% endblock %}
